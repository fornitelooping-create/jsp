<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour P'ti Chat 🐾</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(214, 40, 40, 0.15);
            text-align: center;
            backdrop-filter: blur(12px);
            max-width: 450px;
            width: 90%;
            z-index: 10;
            border: 2px solid #ffb3c6;
            animation: popIn 0.8s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .heart-main {
            font-size: 3.5rem;
            animation: heartbeat 1.2s infinite;
            margin-bottom: 10px;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.15); }
            40% { transform: scale(1); }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        h1 {
            color: #ff4d6d;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            color: #590d22;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 1.15rem;
        }

        .highlight {
            color: #ff4d6d;
            font-weight: bold;
        }

        .btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #ff758f;
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Style des cœurs volants */
        .floating-heart {
            position: absolute;
            color: #ff758f;
            pointer-events: none;
            animation: floatUp 3s linear forwards;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart-main">❤️</div>
        <h1>C'est OUI.</h1>
        
        <p>Tu as bien fait d'essayer, p'ti chat. Oublie le passé, j'ai lu ton message d'hier et ma décision est prise.</p>
        
        <p>Et pour info... c'est moi qui souris comme un con devant mon téléphone quand je reçois un message de toi. 😊</p>
        
        <button class="btn" onclick="burstHearts()">Clique ici pour voir</button>
    </div>

    <script>
        // Lance des cœurs automatiquement au chargement
        window.onload = function() {
            for(let i = 0; i < 20; i++) {
                setTimeout(createHeart, i * 150);
            }
        };

        // Fonction déclenchée par le bouton
        function burstHearts() {
            for (let i = 0; i < 20; i++) {
                createHeart();
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            
            // Mélange de cœurs différents
            const heartTypes = ['❤️', '💖', '✨', '🐾', '🥰'];
            heart.innerHTML = heartTypes[Math.floor(Math.random() * heartTypes.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            
            const size = Math.random() * 25 + 15;
            heart.style.fontSize = size + 'px';
            
            const duration = Math.random() * 2 + 2;
            heart.style.animationDuration = duration + 's';
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }
    </script>
</body>
</html>
